spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/shop_inventory
    username: shop
    password: shop123
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-production-at-least-32-characters}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  first-org-name: ${FIRST_ORG_NAME:Demo Shop}
  admin-email: admin@shop.local
  admin-password: ${ADMIN_PASSWORD:admin123}
  super-admin-email: super@shop.local
  super-admin-password: ${SUPER_ADMIN_PASSWORD:super123}
  default-currency: ${DEFAULT_CURRENCY:INR}

spring.servlet.multipart.max-file-size: 5MB
spring.servlet.multipart.max-request-size: 6MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    org.hibernate.SQL: WARN