# Local dev profile — uses the local PostgreSQL instance (same creds as tests).
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/shop_inventory
    username: shop
    password: shop123
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    baseline-on-migrate: true

app:
  jwt:
    secret: local-dev-secret-key-that-is-long-enough-for-hmac-sha-256
    expiration-ms: 86400000
  first-org-name: Demo Shop
  admin-email: admin@shop.local
  admin-password: admin123
  super-admin-email: super@shop.local
  super-admin-password: super123
  default-currency: INR
