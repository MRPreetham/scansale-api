spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/shop_inventory_test
    username: shop
    password: shop123
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

app:
